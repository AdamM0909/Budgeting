<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #faf8fc; --ink: #3d3a4b; --muted: #8e8a9c; --line: #e7e2ee; --card: #ffffff;
    --overview: #f6c9a8; --cash: #a9d4e2; --bills: #eebfd3; --income: #b9c0f0;
    --expenses: #f6c9a8; --savings: #cdbdea; --debt: #b4dcea; --trim: #f9e4a8;
    --g-bills: #eaa9c5; --g-expenses: #f5b98c; --g-savings: #b9a3e3; --g-debt: #8fcbe0; --g-left: #dde2f6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink);
         font: 14px/1.35 "Comfortaa", "Segoe UI", system-ui, sans-serif; }
  main { max-width: 1240px; margin: 0 auto; padding: 20px 14px 60px; }
  .grid { display: grid; gap: 18px; align-items: start; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }

  .box { background: var(--card); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .box.plain { padding: 16px; }
  .box h3.chart-title { text-align: center; letter-spacing: .28em; font-size: .82rem; font-weight: 600;
                        text-transform: uppercase; margin: 0 0 10px; }
  .head { padding: 16px 10px; text-align: center; font-weight: 600; font-size: .95rem; border-top: 3px solid rgba(0,0,0,.18); }
  .head.spaced { letter-spacing: .3em; text-transform: uppercase; }

  /* title block */
  .titleblock { text-align: center; padding: 18px 10px 8px; }
  .titleblock input { font: inherit; font-size: 2rem; text-align: center; border: 0; background: transparent;
                      color: var(--ink); width: 100%; }
  .titleblock div { letter-spacing: .08em; font-size: 1rem; margin-top: 4px; }

  /* tables */
  table { width: 100%; border-collapse: collapse; }
  th { font-size: .68rem; letter-spacing: .25em; text-transform: uppercase; font-weight: 600;
       padding: 10px 6px; background: rgba(0,0,0,.025); text-align: center; }
  th:first-child { text-align: center; }
  td { padding: 0; border-bottom: 1px dotted #d9d3e3; height: 34px; }
  td.num { width: 34%; }
  .cell { display: flex; align-items: center; gap: 4px; padding: 0 8px; height: 100%; }
  .cell.right { justify-content: space-between; }
  input.t, input.n { font: inherit; font-size: .8rem; color: var(--ink); border: 0; background: transparent;
                     width: 100%; padding: 8px 2px; min-width: 0; }
  input.n { text-align: right; }
  input.t:focus, input.n:focus { outline: 2px solid #b9a3e3; outline-offset: -2px; border-radius: 3px; background: #fff; }
  input[type=checkbox] { accent-color: #b9a3e3; width: 14px; height: 14px; flex: none; }
  td.sym { color: var(--muted); font-size: .75rem; }
  .total td, .left td { font-weight: 700; font-size: .8rem; letter-spacing: .12em; text-transform: uppercase;
                         padding: 10px 8px; background: rgba(0,0,0,.04); border-bottom: 0; height: auto; }
  .total td.v, .left td.v { text-align: right; letter-spacing: 0; text-transform: none; }
  tr.plusminus td:first-child { padding-left: 10px; }
  td.static { padding: 8px 10px; font-size: .8rem; }
  td.static.v { text-align: right; }
  .neg { color: #d6476f; }
  .x { border: 0; background: transparent; color: #c8c1d3; cursor: pointer; font-size: .8rem; padding: 0 4px; }
  .x:hover { color: #d6476f; }
  .addrow { display: block; width: 100%; border: 0; border-top: 1px dotted #d9d3e3; background: transparent;
            color: var(--muted); font: inherit; font-size: .75rem; padding: 9px; cursor: pointer; }
  .addrow:hover { background: rgba(0,0,0,.03); color: var(--ink); }

  /* color themes for tables */
  .t-overview .head { background: var(--overview); } .t-overview table td, .t-overview tbody tr { background: #fff; }
  .t-cash .head { background: var(--cash); }       .t-cash tbody { background: #f4fafc; }
  .t-bills .head { background: var(--bills); }     .t-bills tbody { background: linear-gradient(#fff, #fcf0f5); }
  .t-income .head { background: var(--income); }   .t-income tbody { background: linear-gradient(#fff, #f1f2fc); }
  .t-expenses .head { background: var(--expenses); } .t-expenses tbody { background: linear-gradient(#fff, #fef3ea); }
  .t-savings .head { background: var(--savings); } .t-savings tbody { background: linear-gradient(#fff, #f5f0fb); }
  .t-debt .head { background: var(--debt); }       .t-debt tbody { background: linear-gradient(#fff, #eef8fb); }
  .t-trim .head { background: var(--trim); }

  /* overview */
  .ov { display: grid; grid-template-columns: 110px 1fr; }
  .ov label { font-size: .68rem; letter-spacing: .25em; text-transform: uppercase; font-weight: 700;
              padding: 11px 8px; background: rgba(0,0,0,.03); border-bottom: 1px solid #fff; display: flex; align-items: center; }
  .ov > div { border-bottom: 1px solid var(--line); display: flex; }
  .ov input, .ov select { font: inherit; font-size: .8rem; border: 0; background: transparent; width: 100%;
                           padding: 8px; text-align: center; color: var(--ink); }
  .seg { display: flex; gap: 0; margin: 8px; border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
  .seg button { flex: 1; border: 0; background: #fff; font: inherit; font-size: .75rem; padding: 7px; cursor: pointer; color: var(--muted); }
  .seg button.on { background: var(--savings); color: var(--ink); font-weight: 700; }

  /* charts */
  .ringwrap { display: grid; place-items: center; padding: 6px 0 4px; }
  .ring-c { font-size: 17px; font-weight: 600; fill: #4a4e8f; }
  .ring-s { font-size: 6.5px; fill: var(--muted); letter-spacing: .1em; }
  .pie { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; }
  .legend { list-style: none; margin: 0; padding: 0; font-size: .78rem; min-width: 150px; }
  .legend li { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .legend .dot { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .legend .amt { margin-left: auto; padding-left: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bars { display: grid; gap: 14px; padding: 4px 4px 0; }
  .bargrp { display: grid; grid-template-columns: 70px 1fr; gap: 8px; align-items: center; font-size: .78rem; }
  .barpair { display: grid; gap: 3px; }
  .b { height: 9px; border-radius: 0 3px 3px 0; min-width: 2px; transition: width .25s; }
  .b.bud { background: #c7c4ea; } .b.act { background: #9d9bd6; }
  .key { display: flex; justify-content: center; gap: 14px; font-size: .75rem; margin-bottom: 10px; }
  .key i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  /* trim */
  .tips { list-style: none; margin: 0; padding: 12px; }
  .tips li { background: #fffaf0; border: 1px solid #f3e6c0; border-radius: 8px; padding: 9px 11px; margin-bottom: 8px; font-size: .8rem; }
  .good { color: #2f9e77; font-weight: 700; } .bad { color: #d6476f; font-weight: 700; }

  .foot { text-align: center; margin-top: 22px; color: var(--muted); font-size: .75rem; }
  .foot button { border: 1px solid var(--line); background: #fff; font: inherit; font-size: .75rem; color: var(--muted);
                 padding: 7px 14px; border-radius: 99px; cursor: pointer; margin: 0 4px; }
  .foot button:hover { color: var(--ink); border-color: #b9a3e3; }
</style>
</head>
<body>
<main>
  <div class="grid">

    <div class="box t-overview" id="c-overview">
      <div class="titleblock">
        <input id="month" aria-label="Month name" value="April">
        <div>★ BUDGET DASHBOARD ★</div>
      </div>
      <div class="head spaced">Overview</div>
      <div class="ov">
        <label for="start">Start date</label><div><input id="start" type="date"></div>
        <label for="end">End date</label><div><input id="end" type="date"></div>
        <label for="cur">Currency</label>
        <div><select id="cur"><option>$</option><option>£</option><option>€</option><option>¥</option></select></div>
      </div>
      <div class="seg" role="group" aria-label="Charts show">
        <button data-mode="budget">Budget</button><button data-mode="actual">Actual</button>
      </div>
    </div>

    <div class="box plain" id="c-ring">
      <h3 class="chart-title">Amount left to spend</h3>
      <div class="ringwrap"><svg id="ring" viewBox="0 0 120 120" width="230" height="230" role="img" aria-label="Amount left to spend"></svg></div>
    </div>

    <div class="box plain" id="c-pie">
      <h3 class="chart-title">Allocation summary</h3>
      <div class="pie"><svg id="pie" viewBox="0 0 120 120" width="190" height="190" role="img" aria-label="Allocation pie chart"></svg>
        <ul class="legend" id="pielegend"></ul></div>
    </div>

    <div class="box t-cash">
      <div class="head">CASH FLOW SUMMARY</div>
      <table><thead><tr><th>Category</th><th>Budget</th><th>Actual</th></tr></thead><tbody id="cashbody"></tbody></table>
    </div>

    <div class="box plain">
      <h3 class="chart-title">Cash flow summary</h3>
      <div class="key"><span><i style="background:#c7c4ea"></i>Budget</span><span><i style="background:#9d9bd6"></i>Actual</span></div>
      <div class="bars" id="bars"></div>
    </div>

    <div class="box t-trim">
      <div class="head">✂️ WHAT TO TRIM</div>
      <ul class="tips" id="tips"></ul>
    </div>

    <div class="box t-income" id="sec-income"></div>
    <div class="box t-bills" id="sec-bills"></div>
    <div class="box t-expenses" id="sec-expenses"></div>
    <div class="box t-savings" id="sec-savings"></div>
    <div class="box t-debt" id="sec-debt"></div>
  </div>

  <p class="foot">
    Everything saves in your browser.
    <button id="sample">Reload sample data</button><button id="clear">Clear everything</button>
  </p>
</main>

<script>
const KEY = "budget-dashboard-v1";
const SECS = {
  income:   { title: "INCOME SUMMARY",  check: false },
  bills:    { title: "BILL TRACKER",    check: true  },
  expenses: { title: "EXPENSE TRACKER", check: false },
  savings:  { title: "SAVINGS TRACKER", check: true  },
  debt:     { title: "DEBT TRACKER",    check: true  },
};
const GROUPS = [
  { k: "bills",    label: "Bills",    color: "var(--g-bills)" },
  { k: "expenses", label: "Expenses", color: "var(--g-expenses)" },
  { k: "savings",  label: "Savings",  color: "var(--g-savings)" },
  { k: "debt",     label: "Debt",     color: "var(--g-debt)" },
];
const row = (name, budget, actual = 0) => ({ name, budget, actual, done: false });
const sample = () => ({
  month: "April", start: "", end: "", cur: "$", mode: "budget", rollover: { budget: 0, actual: 0 },
  income:   [row("Paycheck", 3500, 2500), row("Side hustle", 130, 89)],
  bills:    [row("Rent", 1100, 1100), row("Internet", 60, 60), row("Electricity", 110, 0), row("Mobile", 45, 45), row("Gym", 30, 30)],
  expenses: [row("Food", 350, 120), row("Dining out", 250, 140), row("Transportation", 140, 40), row("Household", 120, 0),
             row("Beauty", 80, 0), row("Gifts", 50, 0), row("Entertainment", 140, 25)],
  savings:  [row("Emergency fund", 300, 300), row("Travel", 100, 0)],
  debt:     [row("Student loan", 150, 150), row("Credit card", 100, 0)],
});
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
if (!S || !S.income) S = sample();

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = v => (isFinite(+v) ? +v : 0);
const fmt = n => num(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = n => (n < 0 ? "-" : "") + S.cur + Math.abs(Math.round(n)).toLocaleString();
const pct = n => (Math.round(n * 1000) / 10) + "%";
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const sum = (arr, f) => arr.reduce((s, r) => s + num(r[f]), 0);

function totals(f) {
  const t = { rollover: num(S.rollover[f]), income: sum(S.income, f) };
  GROUPS.forEach(g => t[g.k] = sum(S[g.k], f));
  t.left = t.rollover + t.income - t.bills - t.expenses - t.savings - t.debt;
  return t;
}

/* ---------- section tables ---------- */
function renderSection(k) {
  const sec = SECS[k];
  const rows = S[k].map((r, i) => `
    <tr>
      <td><div class="cell">${sec.check ? `<input type="checkbox" data-s="${k}" data-i="${i}" data-f="done" ${r.done ? "checked" : ""} aria-label="Done">` : ""}
        <input class="t" data-s="${k}" data-i="${i}" data-f="name" value="${esc(r.name)}" placeholder="Category" aria-label="Category"></div></td>
      <td class="num"><div class="cell right"><span class="sym">${S.cur}</span>
        <input class="n" type="number" step="any" inputmode="decimal" data-s="${k}" data-i="${i}" data-f="budget" value="${r.budget || ""}" placeholder="0.00" aria-label="Budget"></div></td>
      <td class="num"><div class="cell right"><span class="sym">${S.cur}</span>
        <input class="n" type="number" step="any" inputmode="decimal" data-s="${k}" data-i="${i}" data-f="actual" value="${r.actual || ""}" placeholder="0.00" aria-label="Actual">
        <button class="x" data-del="${k}:${i}" aria-label="Remove row">✕</button></div></td>
    </tr>`).join("");
  $("sec-" + k).innerHTML = `
    <div class="head">${sec.title}</div>
    <table><thead><tr><th>Category</th><th>Budget</th><th>Actual</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr class="total"><td>Total</td><td class="v" id="tb-${k}"></td><td class="v" id="ta-${k}"></td></tr></tfoot></table>
    <button class="addrow" data-add="${k}">+ add row</button>`;
}

/* ---------- charts ---------- */
function slice(a0, a1, r) {
  const p = a => [60 + r * Math.sin(a), 60 - r * Math.cos(a)];
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  return `M60 60 L${x0} ${y0} A${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1} ${y1}Z`;
}

function renderRing(t) {
  const avail = t.rollover + t.income, R = 42, C = 2 * Math.PI * R;
  const frac = avail > 0 ? Math.max(0, Math.min(1, t.left / avail)) : 0;
  $("ring").innerHTML = `
    <circle cx="60" cy="60" r="${R}" fill="none" stroke="#e9ecfa" stroke-width="13"/>
    <circle cx="60" cy="60" r="${R}" fill="none" stroke="#b9bde8" stroke-width="13" stroke-linecap="butt"
      stroke-dasharray="${frac * C} ${C}" transform="rotate(-90 60 60)"><title>${money(t.left)} left</title></circle>
    <text x="60" y="62" text-anchor="middle" class="ring-c" style="${t.left < 0 ? "fill:#d6476f" : ""}">${money(t.left)}</text>
    <text x="60" y="73" text-anchor="middle" class="ring-s">${t.left < 0 ? "OVER BUDGET" : "LEFT (" + S.mode.toUpperCase() + ")"}</text>`;
}

function renderPie(t) {
  const parts = GROUPS.map(g => ({ label: g.label, v: t[g.k], color: g.color })).filter(p => p.v > 0);
  if (t.left > 0) parts.push({ label: "Left", v: t.left, color: "var(--g-left)" });
  const total = parts.reduce((s, p) => s + p.v, 0);
  let svg = "";
  if (!total) svg = `<circle cx="60" cy="60" r="54" fill="var(--g-left)"/>`;
  let a = 0;
  parts.forEach(p => {
    const sw = p.v / total * Math.PI * 2;
    svg += sw >= Math.PI * 2 - 1e-6
      ? `<circle cx="60" cy="60" r="54" fill="${p.color}"><title>${p.label}: ${money(p.v)}</title></circle>`
      : `<path d="${slice(a, a + sw, 54)}" fill="${p.color}" stroke="#fff" stroke-width="1"><title>${p.label}: ${money(p.v)}</title></path>`;
    a += sw;
  });
  $("pie").innerHTML = svg;
  $("pielegend").innerHTML = parts.length ? parts.map(p =>
    `<li><span class="dot" style="background:${p.color}"></span>${p.label}<span class="amt">${money(p.v)} · ${pct(p.v / total)}</span></li>`).join("")
    : "<li>Add some numbers 🌸</li>";
}

function renderBars(tb, ta) {
  const max = Math.max(1, ...GROUPS.flatMap(g => [tb[g.k], ta[g.k]]));
  $("bars").innerHTML = GROUPS.map(g => `
    <div class="bargrp"><span>${g.label}</span><div class="barpair">
      <div class="b bud" style="width:${tb[g.k] / max * 100}%" title="Budget ${money(tb[g.k])}"></div>
      <div class="b act" style="width:${ta[g.k] / max * 100}%" title="Actual ${money(ta[g.k])}"></div></div></div>`).join("");
}

/* ---------- cash flow table ---------- */
function renderCash(tb, ta) {
  const lines = [["+", "Rollover", "rollover"], ["+", "Income", "income"], ["-", "Bills", "bills"],
                 ["-", "Expenses", "expenses"], ["-", "Savings", "savings"], ["-", "Debt", "debt"]];
  $("cashbody").innerHTML = lines.map(([s, name, k]) => `
    <tr class="plusminus"><td class="static">${s} &nbsp;${name}</td>
      <td class="static v">${S.cur} ${k === "rollover"
        ? `<input class="n" style="width:90px" type="number" step="any" data-roll="budget" value="${S.rollover.budget || ""}" placeholder="0.00" aria-label="Rollover budget">`
        : fmt(tb[k])}</td>
      <td class="static v">${S.cur} ${k === "rollover"
        ? `<input class="n" style="width:90px" type="number" step="any" data-roll="actual" value="${S.rollover.actual || ""}" placeholder="0.00" aria-label="Rollover actual">`
        : fmt(ta[k])}</td></tr>`).join("") +
    `<tr class="left"><td>Left</td><td class="v ${tb.left < 0 ? "neg" : ""}">${S.cur} ${fmt(tb.left)}</td><td class="v ${ta.left < 0 ? "neg" : ""}">${S.cur} ${fmt(ta.left)}</td></tr>`;
}

/* ---------- trim suggestions ---------- */
function renderTips(tb) {
  const avail = tb.rollover + tb.income, tips = [];
  if (avail <= 0) { $("tips").innerHTML = "<li>Add your income to get suggestions 💌</li>"; return; }

  if (tb.left < 0) {
    let need = -tb.left;
    tips.push(`<span class="bad">Your plan is ${money(need)} over your income.</span> Here's what to cut:`);
    for (const r of [...S.expenses].filter(r => num(r.budget) > 0).sort((a, b) => num(b.budget) - num(a.budget))) {
      if (need <= 0) break;
      const cut = Math.min(num(r.budget), need);
      tips.push(`✂️ <b>${esc(r.name || "Untitled")}</b>: trim ${money(cut)}${cut >= num(r.budget) ? " (remove it)" : ""}`);
      need -= cut;
    }
    if (need > 0) {
      const big = [...S.bills].sort((a, b) => num(b.budget) - num(a.budget))[0];
      tips.push(`Expenses alone won't cover it, still ${money(need)} short.${big ? ` Your biggest bill is <b>${esc(big.name || "Untitled")}</b> (${money(num(big.budget))}), worth a look for a cheaper plan.` : ""}`);
    }
  } else {
    tips.push(`<span class="good">Your plan fits with ${money(tb.left)} to spare!</span>`);
  }

  const overs = [];
  Object.keys(SECS).filter(k => k !== "income").forEach(k => S[k].forEach(r => {
    if (num(r.actual) > num(r.budget) && num(r.actual) > 0) overs.push(`${esc(r.name || "Untitled")} (${money(num(r.actual))} of ${money(num(r.budget))})`);
  }));
  if (overs.length) tips.push(`Over their budget: ${overs.join(", ")}.`);

  if (tb.expenses > tb.income * 0.3 && tb.left >= 0) {
    const top = [...S.expenses].sort((a, b) => num(b.budget) - num(a.budget))[0];
    tips.push(`Expenses are ${pct(tb.expenses / avail)} of your money${top ? `. Biggest: <b>${esc(top.name || "Untitled")}</b> (${money(num(top.budget))})` : ""}.`);
  }
  if (tb.savings < avail * 0.2) tips.push(`Savings are ${pct(tb.savings / avail)} of your money. A common goal is 20% (${money(avail * 0.2)}).`);
  if (tips.length === 1 && tb.left >= 0) tips.push("Nothing to trim. Lovely! 🎉");
  $("tips").innerHTML = tips.map(t => `<li>${t}</li>`).join("");
}

/* ---------- main render ---------- */
function update() {
  const tb = totals("budget"), ta = totals("actual");
  Object.keys(SECS).forEach(k => {
    $("tb-" + k).textContent = S.cur + " " + fmt(sum(S[k], "budget"));
    $("ta-" + k).textContent = S.cur + " " + fmt(sum(S[k], "actual"));
  });
  renderCash(tb, ta);
  const t = S.mode === "actual" ? ta : tb;
  renderRing(t); renderPie(t); renderBars(tb, ta); renderTips(tb);
  document.querySelectorAll(".seg button").forEach(b => b.classList.toggle("on", b.dataset.mode === S.mode));
  persist();
}
function renderAll() {
  $("month").value = S.month; $("start").value = S.start || ""; $("end").value = S.end || ""; $("cur").value = S.cur;
  Object.keys(SECS).forEach(renderSection);
  update();
}

/* ---------- events ---------- */
document.addEventListener("input", e => {
  const d = e.target.dataset;
  if (d.s !== undefined) {
    const r = S[d.s][+d.i];
    r[d.f] = d.f === "name" ? e.target.value : d.f === "done" ? e.target.checked : num(e.target.value);
  } else if (d.roll) S.rollover[d.roll] = num(e.target.value);
  else if (e.target.id === "month") S.month = e.target.value;
  else if (e.target.id === "start") S.start = e.target.value;
  else if (e.target.id === "end") S.end = e.target.value;
  else if (e.target.id === "cur") { S.cur = e.target.value; renderAll(); return; }
  else return;
  // keep focus: only refresh the cash table when the rollover box itself is not being typed in
  if (d.roll) { update_noCash(totals("budget"), totals("actual")); return; }
  update();
});
function update_noCash(tb, ta) {
  Object.keys(SECS).forEach(k => {
    $("tb-" + k).textContent = S.cur + " " + fmt(sum(S[k], "budget"));
    $("ta-" + k).textContent = S.cur + " " + fmt(sum(S[k], "actual"));
  });
  const left = $("cashbody").querySelector(".left");
  left.innerHTML = `<td>Left</td><td class="v ${tb.left < 0 ? "neg" : ""}">${S.cur} ${fmt(tb.left)}</td><td class="v ${ta.left < 0 ? "neg" : ""}">${S.cur} ${fmt(ta.left)}</td>`;
  const t = S.mode === "actual" ? ta : tb;
  renderRing(t); renderPie(t); renderBars(tb, ta); renderTips(tb); persist();
}
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.add) { S[b.dataset.add].push(row("", 0)); renderSection(b.dataset.add); update(); }
  else if (b.dataset.del) { const [k, i] = b.dataset.del.split(":"); S[k].splice(+i, 1); renderSection(k); update(); }
  else if (b.dataset.mode) { S.mode = b.dataset.mode; update(); }
  else if (b.id === "sample") { if (confirm("Replace everything with the sample data?")) { S = sample(); renderAll(); } }
  else if (b.id === "clear") {
    if (confirm("Clear all rows and start fresh?")) {
      S = { month: S.month, start: "", end: "", cur: S.cur, mode: "budget", rollover: { budget: 0, actual: 0 },
            income: [row("Paycheck", 0)], bills: [row("", 0)], expenses: [row("", 0)], savings: [row("", 0)], debt: [row("", 0)] };
      renderAll();
    }
  }
});
renderAll();
</script>
